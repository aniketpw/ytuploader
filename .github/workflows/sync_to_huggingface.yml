name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push --force https://AniketPW:$HF_TOKEN@huggingface.co/spaces/AniketPW/Drive2Youtube main
          else
            echo "HF_TOKEN secret not set in GitHub repository settings. Skipping auto-sync."
          fi
